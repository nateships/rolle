:root{color-scheme:light dark;--background:light-dark(#F4F0E8,#101114);--foreground:light-dark(#101114,#F4F0E8);--border:light-dark(#c9c7c0,#3e4147);--primary:light-dark(#101114,#F4F0E8);--primary-foreground:light-dark(#F4F0E8,#101114)}
*{box-sizing:border-box}body{margin:0;background:var(--background);color:var(--foreground);font:15px/1.5 system-ui,sans-serif;padding:32px 20px}main{max-width:880px;margin:auto}h1{font-size:24px;margin:0 0 4px;font-weight:600}.intro{margin:0 0 24px;opacity:.75}.viz-controls,.viz-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.form-label{display:flex;align-items:center;gap:8px}.btn,.form-select{font:inherit;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:transparent;color:inherit;cursor:pointer}.btn[aria-pressed=true]{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}.form-select:disabled{opacity:.5}.text-small{font-size:13px}.viz-row{justify-content:center}footer{font-size:12px;margin-top:24px;opacity:.7}a{color:inherit}button:focus-visible,select:focus-visible{outline:3px solid #8BA9FF;outline-offset:3px}@media(pointer:coarse){.btn,.form-select{min-height:44px}}@media(max-width:480px){body{padding:20px 12px}.form-label{width:100%;margin-top:4px}}
</style></head><body><main><h1>Rolle gopher motion study</h1><p class="intro">Editable vector reconstruction · hidden anatomy added for animation</p><div id="rolle-motion-lab">
  <div class="viz-controls" aria-label="Gopher animation controls">
    <button type="button" class="btn" data-action="rest" aria-pressed="true">Rest</button>
    <button type="button" class="btn" data-action="dance" aria-pressed="false">Dance</button>
    <button type="button" class="btn" data-action="hide" aria-pressed="false">Hide</button>
    <button type="button" class="btn" data-action="peek" aria-pressed="false">Peek</button>
    <button type="button" class="btn" data-action="layers" aria-pressed="false">Separate layers</button>
    <label class="form-label">Peek behind
      <select class="form-select" id="rolle-depth">
        <option value="front">Green card</option>
        <option value="middle">Orange card</option>
        <option value="back">Blue card</option>
      </select>
    </label>
  </div>

d="ear-left" fill="#F4F0E8" stroke="#101114" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" inkscape:groupmode="layer" inkscape:label="ear-left"><path d="M165 32 C145 17 124 31 127 51 C129 66 140 72 151 73 Z"/><ellipse cx="151" cy="51" rx="10" ry="10" fill="#101114" stroke="none"/></g><g id="ear-right" fill="#F4F0E8" stroke="#101114" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" inkscape:groupmode="layer" inkscape:label="ear-right"><path d="M325 32 C346 14 368 30 364 50 C362 64 351 70 339 72 Z"/><ellipse cx="341" cy="49" rx="10" ry="10" fill="#101114" stroke="none"/></g><g id="foot-left" fill="#F4F0E8" stroke="#101114" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" inkscape:groupmode="layer" inkscape:label="foot-left"><path d="M180 250 Q174 268 171 276 Q173 283 189 282 L210 280 Q217 276 210 259 Z"/></g><g id="foot-right" fill="#F4F0E8" stroke="#101114" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" inkscape:groupmode="layer" inkscape:label="foot-right"><path d="M284 259 Q279 276 286 280 L309 282 Q326 283 326 275 L316 250 Z"/></g><g id="arm-left" fill="#F4F0E8" stroke="#101114" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" inkscape:groupmode="layer" inkscape:label="arm-left"><path d="M158 158 Q134 151 132 174 Q132 194 153 194 L168 184 Z"/></g><g id="arm-right" fill="#F4F0E8" stroke="#101114" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" inkscape:groupmode="layer" inkscape:label="arm-right"><path d="M332 158 Q356 151 358 174 Q358 194 337 194 L322 184 Z"/></g><g id="body" fill="#F4F0E8" stroke="#101114" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" inkscape:groupmode="layer" inkscape:label="body"><path d="M145 124 C145 44 178 7 240 7 C315 3 345 52 345 122 L345 213 C345 257 326 273 299 274 L192 274 C158 273 145 253 145 214 Z"/></g><g id="eye-left" fill="#F4F0E8" stroke="#101114" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" inkscape:groupmode="layer" inkscape:label="eye-left"><ellipse cx="207" cy="61" rx="32" ry="32" stroke-width="3.5"/></g><g id="pupil-left" fill="#F4F0E8" stroke="#101114" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" inkscape:groupmode="layer" inkscape:label="pupil-left"><ellipse cx="193" cy="64" rx="11" ry="12" fill="#101114" stroke="none"/></g><g id="eye-right" fill="#F4F0E8" stroke="#101114" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" inkscape:groupmode="layer" inkscape:label="eye-right"><ellipse cx="287" cy="60" rx="32" ry="32" stroke-width="3.5"/></g><g id="pupil-right" fill="#F4F0E8" stroke="#101114" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" inkscape:groupmode="layer" inkscape:label="pupil-right"><ellipse cx="273" cy="63" rx="11" ry="12" fill="#101114" stroke="none"/></g><g id="teeth" fill="#F4F0E8" stroke="#101114" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" inkscape:groupmode="layer" inkscape:label="teeth"><path d="M233 107 L233 128 Q233 135 241 135 Q249 135 249 128 L249 107 Z" stroke-width="3.5"/><path d="M249 107 L249 128 Q249 135 257 135 Q265 135 265 128 L265 107 Z" stroke-width="3.5"/></g><g id="muzzle" fill="#F4F0E8" stroke="#101114" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" inkscape:groupmode="layer" inkscape:label="muzzle"><path d="M246 92 C228 93 219 104 224 111 C228 118 240 111 249 110 C258 111 269 118 273 111 C278 102 266 93 253 92 Z" stroke-width="3.5"/></g><g id="nose" fill="#F4F0E8" stroke="#101114" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" inkscape:groupmode="layer" inkscape:label="nose"><ellipse cx="249" cy="90" rx="14" ry="9" fill="#101114" stroke="none"/></g></g></g><g id="card-green" inkscape:groupmode="layer" inkscape:label="card-green"><path fill="#00CE78" d="M139 127 H157 Q249 148 340 127 H346 Q379 127 379 160 V255 Q379 287 346 287 H238 V235 Q238 211 262 211 H286 Q290 211 290 207 V181 Q290 176 286 176 H251 Q187 176 187 241 V287 H140 Q108 287 108 256 V161 Q108 127 139 127 Z"/></g><g id="hands-root" ><g id="hand-left" fill="#F4F0E8" stroke="#101114" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" inkscape:groupmode="layer" inkscape:label="hand-left"><circle cx="168" cy="135" r="20" stroke-width="7"/></g><g id="hand-right" fill="#F4F0E8" stroke="#101114" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" inkscape:groupmode="layer" inkscape:label="hand-right"><circle cx="333" cy="134" r="20" stroke-width="7"/></g></g></g>
</svg></div>
  <div class="viz-row text-small"><span id="rolle-status" role="status" aria-live="polite">Rest · green card</span></div>
</div>
<style>
  #rolle-motion-lab .rolle-artwork { width:100%; max-width:650px; margin:auto; }
  #rolle-motion-lab .rolle-artwork > svg { width:100%; height:auto; display:block; overflow:hidden; }
</style>
<script>
(() => {
  const root=document.getElementById('rolle-motion-lab');
  const q=s=>root.querySelector(s);
  const scene=q('#scene'), depth=q('#gopher-depth'), gopher=q('#gopher-root'), hands=q('#hands-root');
  const blue=q('#card-blue'), orange=q('#card-orange'), green=q('#card-green');
  const select=q('#rolle-depth'), status=q('#rolle-status');
  const left=q('#hand-left'), right=q('#hand-right');
  const reduced=matchMedia('(prefers-reduced-motion: reduce)');
  let frame=0, current='rest', hidden=false;
  const poses={front:{x:0,y:0,s:1},middle:{x:30,y:0,s:.64},back:{x:5,y:-12,s:.42}};
  const label={front:'green',middle:'orange',back:'blue'};
  const tr=(el,value)=>el.setAttribute('transform',value);
  const ease=t=>1-Math.pow(1-t,3);
  function pose(dy=0){
    const p=poses[select.value], value=`translate(${p.x} ${p.y+dy}) scale(${p.s})`;
    tr(gopher,value);tr(hands,value);
  }
  function reset(){
    cancelAnimationFrame(frame);
    for(const el of [gopher,hands,blue,orange,green,...gopher.children,left,right]) el.removeAttribute('transform');
    hands.removeAttribute('opacity');depth.removeAttribute('mask');
    scene.append(blue,orange,depth,green,hands);
    const key=select.value;
    scene.insertBefore(depth,key==='back'?blue:key==='middle'?orange:green);
    scene.insertBefore(hands,key==='back'?orange:key==='middle'?green:null);
    depth.setAttribute('mask',`url(#holdout-${key})`);
    pose();
  }
  function animate(ms,paint,done){
    const begin=performance.now();
    function tick(now){const t=Math.min(1,(now-begin)/ms);paint(t);if(t<1)frame=requestAnimationFrame(tick);else if(done)done();}
    if(reduced.matches || ms<=0){paint(1);if(done)done();}else frame=requestAnimationFrame(tick);
  }
  function dance(t){
    const beat=t*12*Math.PI, swing=Math.sin(beat);
    const value=`translate(${-40+swing*10} ${-35-Math.abs(swing)*16}) rotate(${swing*7} 246 270)`;
    tr(gopher,value);tr(hands,value);
    tr(q('#arm-left'),`rotate(${swing*24+25} 158 170)`);
    tr(q('#arm-right'),`rotate(${swing*24-25} 334 170)`);
    tr(left,`rotate(${swing*24+25} 158 170) translate(-28 44)`);
    tr(right,`rotate(${swing*24-25} 334 170) translate(18 45)`);
    tr(q('#foot-left'),`rotate(${swing*20} 195 263)`);
    tr(q('#foot-right'),`rotate(${-swing*20} 301 263)`);
    tr(q('#pupil-left'),`translate(${swing*3} 0)`);tr(q('#pupil-right'),`translate(${swing*3} 0)`);
  }
  function run(action){
    const wasHidden=hidden;
    reset();current=action;hidden=false;
    root.querySelectorAll('[data-action]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.action===action)));
    select.disabled=action==='dance'||action==='layers';
    status.textContent=action==='layers'?'Separated cards, ears, face, limbs and paws':`${action[0].toUpperCase()+action.slice(1)} · ${label[select.value]} card`;
    if(action==='dance'){
      depth.removeAttribute('mask');scene.append(depth,hands);
      animate(6000,dance,()=>{status.textContent='Dance complete';});
    }else if(action==='hide'){
      hidden=true;
      animate(wasHidden?0:650,t=>{const e=ease(t);pose(e*370);hands.setAttribute('opacity',Math.max(0,1-t*4));},()=>{gopher.setAttribute('transform','translate(0 700)');status.textContent=`Hidden behind ${label[select.value]} card`;});
    }else if(action==='peek'){
      animate(900,t=>{const e=ease(t);pose((1-e)*370);hands.setAttribute('opacity',Math.max(0,(t-.7)/.3));});
    }else if(action==='layers'){
      depth.removeAttribute('mask');scene.append(depth,hands);
      tr(blue,'translate(-40 15) scale(.6)');tr(orange,'translate(-40 85) scale(.6)');tr(green,'translate(-40 155) scale(.6)');
      tr(gopher,'translate(75 -35) scale(.86)');tr(hands,'translate(75 -35) scale(.86)');
      tr(q('#ear-left'),'translate(-22 -12)');tr(q('#ear-right'),'translate(22 -12)');
      tr(q('#foot-left'),'translate(-15 35)');tr(q('#foot-right'),'translate(15 35)');
      tr(q('#arm-left'),'translate(-20 10)');tr(q('#arm-right'),'translate(20 10)');
      tr(left,'translate(-55 85)');tr(right,'translate(45 85)');
    }
  }
  root.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>run(b.dataset.action)));
  select.addEventListener('change',()=>run('peek'));
  reduced.addEventListener('change',()=>run('rest'));
  document.addEventListener('visibilitychange',()=>{if(document.hidden && current==='dance')run('rest');});
  reset();
})();
</script>
<footer>Go gopher by Renee French · CC BY 4.0 · Adapted for Rolle. <a href="README.md">Layer and integration notes</a></footer></main></body></html>
