# Spell check for source and docs. https://github.com/crate-ci/typos

[files]
extend-exclude = [
  "apps/desktop/frontend/bindings/",
  "apps/desktop/frontend/aube-lock.yaml",
  "docs/package-lock.json",
  "docs/brand/fonts/",
  "*.svg",
  "*.icns",
  "go.sum",
]

[default.extend-identifiers]
UDID = "UDID" # Apple device identifier in the Wails iOS tasks
abd456 = "abd456" # test fixture id
