# Spell check for source and docs. https://github.com/crate-ci/typos

[files]
extend-exclude = [
  "apps/desktop/frontend/bindings/",
  "apps/desktop/frontend/pnpm-lock.yaml",
  "docs/pnpm-lock.yaml",
  "docs/brand/fonts/",
  "*.svg",
  "*.icns",
  "go.sum",
]

[default.extend-identifiers]

[default.extend-words]
# Azure Kubernetes Service, not a misspelling of "ask".
AKS = "AKS"
