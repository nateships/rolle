<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rolle</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    background: #101114; color: #F4F0E8;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  main {
    width: min(420px, calc(100% - 32px)); padding: 40px 32px;
    border: 1px solid #3F4248; border-radius: 16px; background: #1E2024;
    text-align: center;
    animation: rise .35s ease-out;
  }
  svg { width: 72px; height: 72px; display: block; margin: 0 auto 20px; }
  h1 { margin: 0 0 8px; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  p { margin: 0; color: #B4B8C0; }
  .ok { color: #00CE78; }
  .err { color: #FF7900; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { main { animation: none; } }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 512 512" role="img" aria-label="Rolle">
    <path fill="#244CFF" d="M 110 98 L 276 98 Q 294 98 300 116 L 306 132 L 138 132 Q 120 132 120 150 L 120 336 L 102 330 Q 80 324 80 302 L 80 128 Q 80 98 110 98 Z"/>
    <path fill="#FF7900" d="M 164 146 L 328 146 Q 346 146 352 164 L 358 180 L 192 180 Q 174 180 174 198 L 174 370 L 156 364 Q 134 358 134 336 L 134 176 Q 134 146 164 146 Z"/>
    <path fill="#00CE78" d="M 216 194 L 402 194 Q 432 194 432 224 L 432 384 Q 432 414 402 414 L 312 414 L 312 346 Q 312 316 342 316 L 366 316 L 366 282 L 336 282 Q 264 282 264 354 L 264 414 L 216 414 Q 186 414 186 384 L 186 224 Q 186 194 216 194 Z"/>
  </svg>
  <h1 class="{{.Class}}">{{.Title}}</h1>
  <p>{{.Text}}</p>
</main>
</body>
</html>
