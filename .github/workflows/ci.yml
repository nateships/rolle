name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Go and golangci-lint write their caches where these point, so the cache
# step names one fixed directory on every OS instead of looking paths up.
env:
  GOMODCACHE: ${{ github.workspace }}/.cache/go/mod
  GOCACHE: ${{ github.workspace }}/.cache/go/build
  GOLANGCI_LINT_CACHE: ${{ github.workspace }}/.cache/golangci-lint

# A new push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Wails Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev build-essential pkg-config
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      # mise caches the tools; this caches what Go and the linter build. The
      # build cache changes every run, so the sha in the key saves each one
      # and the restore keys pick the newest match.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-
      - run: mise run setup
      - run: mise run check
      # The frontend checks give the same answer on every OS; Linux runs them.
      - if: runner.os == 'Linux'
        run: mise run check:frontend
      - run: mise run desktop:build

  # Capslock reports which capabilities (network, exec, files, ...) each Go
  # package reaches through its whole dependency graph. The job fails when the
  # set drifts from capslock.json, so a dependency that starts talking to the
  # network cannot arrive without a visible change to that file.
  capabilities:
    runs-on: ubuntu-latest
    env:
      MISE_DISABLE_TOOLS: go:github.com/wailsapp/wails/v3/cmd/wails3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: mise run capabilities:check

  # The hooks that compile or test code run in the check job; this job keeps
  # the fast ones: formatting, file checks, workflow lint, typos.
  hooks:
    runs-on: ubuntu-latest
    env:
      MISE_DISABLE_TOOLS: go:github.com/wailsapp/wails/v3/cmd/wails3
      SKIP: go-vet,golangci-lint,oxfmt,oxlint,tsc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: prek run --show-diff-on-failure --color=always --all-files

  docs:
    runs-on: ubuntu-latest
    env:
      MISE_DISABLE_TOOLS: go:github.com/wailsapp/wails/v3/cmd/wails3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: mise run docs:build
