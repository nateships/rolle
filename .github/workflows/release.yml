name: Release

on:
  push:
    tags: ["v*"]
  # A manual run bumps the tap alone, for a release whose tap job failed.
  workflow_dispatch:
    inputs:
      version:
        description: Released version to put in the cask, without the v
        required: true

permissions: {}

# Each job that needs the version strips the v prefix from the tag itself:
# tag v1.2.3 becomes VERSION=1.2.3 for ldflags, packaging, and the manifest.
#
# Flow: every desktop runner builds and signs its own package and stores it as
# a workflow artifact. The manifest job signs the update manifest over those
# files. The publish job then downloads everything and goreleaser creates the
# GitHub release in one step, with the CLI archives, the desktop packages, the
# manifest, and the notes. Nothing is uploaded to GitHub before that point, and
# the draft that release-please made stays a draft until goreleaser fills it
# and publishes it.

jobs:
  desktop:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Strip the v prefix from the tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Wails Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev build-essential pkg-config
      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        # winget exits non-zero on transient source errors; the step checks for
        # makensis itself and retries.
        run: |
          $exe = 'C:\Program Files (x86)\NSIS\makensis.exe'
          foreach ($attempt in 1..3) {
            winget install --id NSIS.NSIS --exact --silent --disable-interactivity --accept-source-agreements --accept-package-agreements
            if (Test-Path $exe) { break }
            Start-Sleep -Seconds 30
          }
          if (-not (Test-Path $exe)) { throw 'NSIS did not install' }
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files (x86)\NSIS'
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false
      - run: mise run setup
      - name: Stamp the version into the packaging metadata
        shell: bash
        working-directory: apps/desktop/build
        # The Wails templates carry a fixed 0.0.1. The .app, .deb, and the
        # Windows installer read their version from these files, not from ldflags.
        # Windows fixed version fields take numbers only, so a pre-release tag
        # such as 0.1.0-rc.1 becomes 0.1.0 there and stays full in display strings.
        run: |
          perl -pi -e "s/\b0\.0\.1\b/${VERSION}/g" config.yml darwin/Info.plist darwin/Info.dev.plist windows/info.json windows/nsis/wails_tools.nsh linux/nfpm/nfpm.yaml
          NUMERIC="${VERSION%%-*}"
          perl -pi -e "s/\"file_version\": \"\Q${VERSION}\E\"/\"file_version\": \"${NUMERIC}\"/" windows/info.json
          perl -pi -e "s/INFO_FILEVERSION \"\Q${VERSION}\E\"/INFO_FILEVERSION \"${NUMERIC}\"/" windows/nsis/wails_tools.nsh
      - name: Import Apple signing certificate
        if: runner.os == 'macOS'
        env:
          P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$P12_BASE64" ]; then
            echo "APPLE_CERTIFICATE_P12 is not set; the app ships unsigned."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -nE 's/.*"(Developer ID Application: [^"]+)".*/\1/p' | head -1)"
          if [ -z "$IDENTITY" ]; then echo "No Developer ID Application identity in the certificate"; exit 1; fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            xcrun notarytool store-credentials rolle-ci --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --keychain "$KEYCHAIN" > /dev/null
            echo "NOTARY_PROFILE=rolle-ci" >> "$GITHUB_ENV"
          else
            echo "Notarization secrets are not set; the app is signed but not notarized."
          fi
      - name: Build and package
        working-directory: apps/desktop
        shell: bash
        # Each platform Taskfile has a release task: build, sign, and name the
        # files the updater and the release expect.
        run: wails3 task release VERSION="$VERSION"
      - name: Store the package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ runner.os }}
          if-no-files-found: error
          path: |
            apps/desktop/bin/rolle-update-macos-universal.zip
            apps/desktop/bin/*.dmg
            apps/desktop/bin/rolle-update-windows-*.zip
            apps/desktop/bin/rolle-installer.exe
            apps/desktop/bin/*.AppImage
            apps/desktop/bin/*.deb

  manifest:
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Strip the v prefix from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Write the release notes
        # A release that release-please created already carries its notes;
        # reuse them so the updater and the release agree. A tag pushed by
        # hand gets the commit subjects since the previous tag. A stable
        # release compares against the previous stable tag, so it also covers
        # its pre-releases.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json body --jq .body > notes.md 2>/dev/null && [ -s notes.md ]; then
            echo "Using the notes of the existing release."
            cat notes.md
            exit 0
          fi
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prev="$(git tag --merged "${GITHUB_REF_NAME}^" --sort=-v:refname | head -1)"
          else
            prev="$(git tag --merged "${GITHUB_REF_NAME}^" --sort=-v:refname | grep -v -- - | head -1)"
          fi
          {
            echo "## rolle ${VERSION}"
            echo
            if [ -n "$prev" ]; then
              git log --no-merges --format='- %s' "${prev}..${GITHUB_REF_NAME}"
              echo
              echo "Full changelog: https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${GITHUB_REF_NAME}"
            else
              echo "First release."
            fi
          } > notes.md
          cat notes.md
      # mise builds wails3 from source, which needs the GTK headers.
      - name: Install Wails Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev build-essential pkg-config
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false
      - name: Collect the updater payloads
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-*
          merge-multiple: true
          path: packages
      - name: Keep only the files the updater installs
        run: |
          mkdir artifacts
          cp packages/rolle-update-macos-universal.zip packages/rolle-update-windows-amd64.zip packages/rolle-update-windows-arm64.zip packages/rolle-linux-amd64.AppImage artifacts/
      - name: Write signing key
        run: printf '%s' "$ROLLE_UPDATER_KEY" > updater.key && chmod 600 updater.key
        env:
          ROLLE_UPDATER_KEY: ${{ secrets.ROLLE_UPDATER_KEY }}
      - name: Build and verify the signed manifest
        run: |
          channel=stable; case "$GITHUB_REF_NAME" in *-*) channel=beta;; esac
          wails3 updater manifest -version "${VERSION}" -channel "$channel" -key updater.key \
            -name "rolle ${VERSION}" -notes-file notes.md \
            -url-prefix "https://github.com/nateships/rolle/releases/download/${GITHUB_REF_NAME}/" \
            -output artifacts/manifest.json artifacts
          wails3 updater verify -manifest artifacts/manifest.json -publickey apps/desktop/build/updater.pub
      - name: Store the manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manifest
          if-no-files-found: error
          path: artifacts/manifest.json
      - name: Store the release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          if-no-files-found: error
          path: notes.md

  # Builds the CLI archives, then creates the GitHub release with every desktop
  # package and the manifest attached.
  publish:
    needs: manifest
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # cosign signs checksums.txt with the workflow's OIDC identity, and the
      # provenance attestation is written with the same identity.
      id-token: write
      attestations: write
    env:
      # goreleaser builds the CLI with plain go; wails3 is not needed here.
      MISE_DISABLE_TOOLS: go:github.com/wailsapp/wails/v3/cmd/wails3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false
      - name: Collect the desktop packages and the manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "{desktop-*,manifest}"
          merge-multiple: true
          path: release-assets
      - name: Collect the release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: release-notes
      - run: ls -la release-assets release-notes
      - name: Publish the release
        # The version matches the goreleaser pin in mise.toml; Renovate bumps
        # both in one pull request.
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.1
          args: release --clean --release-notes release-notes/notes.md
        env:
          # A final tag often sits on the same commit as its last release
          # candidate. Name the tag that triggered this run so goreleaser does
          # not pick the other one.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Build provenance for every file in checksums.txt: the CLI archives,
      # the desktop packages, and the manifest. Users verify with
      # gh attestation verify <file> --repo nateships/rolle.
      - name: Attest the release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

  # Runs after the release is public, so the cask URL resolves as soon as the
  # tap updates. brew bump-cask-pr rewrites version and sha256 in the cask,
  # which lives in the tap. The cask installs the app and the rolle command
  # inside it. A missing tap token skips this job instead of failing.
  tap:
    needs: publish
    # Pre-release tags (v1.2.0-rc.1) stay off Homebrew. A manual run skips
    # the build jobs and bumps the tap for the version given.
    if: ${{ !cancelled() && !contains(github.ref_name, '-') && (github.event_name == 'workflow_dispatch' || needs.publish.result == 'success') }}
    runs-on: macos-latest
    permissions: {}
    steps:
      - name: Pick the version from the tag or the input
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            echo "VERSION=$INPUT_VERSION" >> "$GITHUB_ENV"
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi
      - uses: Homebrew/actions/setup-homebrew@082c94ee19e776205cfa8e43802917d1425e2fe7 # main
      - name: Bump the cask in the tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          HOMEBREW_NO_INSTALL_FROM_API: "1"
        run: |
          set -euo pipefail
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set; the cask is not updated."
            exit 0
          fi
          # Homebrew loads casks only from taps the user trusts. Trust ours
          # before tapping it, or the tap fails as invalid.
          brew trust --tap nateships/tap
          brew tap nateships/tap
          tap="$(brew --repository nateships/tap)"
          git -C "$tap" config user.name "github-actions[bot]"
          git -C "$tap" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # bump-cask-pr downloads this tag's DMG and rewrites version and
          # sha256; a missing cask fails the job.
          brew bump-cask-pr nateships/tap/rolle --version "$VERSION" --write-only --commit --no-audit --no-browse
          git -C "$tap" push "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/nateships/homebrew-tap.git" HEAD:main
