name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

# Each job that needs the version strips the v prefix from the tag itself:
# tag v1.2.3 becomes VERSION=1.2.3 for ldflags, packaging, and the manifest.
#
# Flow: every desktop runner builds and signs its own package and stores it as
# a workflow artifact. The manifest job signs the update manifest over those
# files. The cli job then downloads everything and goreleaser creates the
# GitHub release in one step, with the CLI archives, the desktop packages, the
# manifest, and the notes. Nothing is uploaded to GitHub before that point.

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            task: darwin:package:universal
            artifact: apps/desktop/bin/Rolle.app
          - os: windows-latest
            # Windows builds both architectures below; the installer carries both.
            task: ""
            artifact: apps/desktop/bin/Rolle-installer.exe
          - os: ubuntu-latest
            task: linux:create:appimage linux:create:deb
            artifact: apps/desktop/bin/Rolle-*
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Strip the v prefix from the tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Wails Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev build-essential pkg-config
      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files (x86)\NSIS'
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false
      - run: mise run setup
      - name: Stamp the version into the packaging metadata
        shell: bash
        working-directory: apps/desktop/build
        # The Wails templates carry a fixed 0.0.1. The .app, .deb, and the
        # Windows installer read their version from these files, not from ldflags.
        # Windows fixed version fields take numbers only, so a pre-release tag
        # such as 0.1.0-rc.1 becomes 0.1.0 there and stays full in display strings.
        run: |
          perl -pi -e "s/\b0\.0\.1\b/${VERSION}/g" config.yml darwin/Info.plist darwin/Info.dev.plist windows/info.json windows/nsis/wails_tools.nsh linux/nfpm/nfpm.yaml
          NUMERIC="${VERSION%%-*}"
          perl -pi -e "s/\"file_version\": \"\Q${VERSION}\E\"/\"file_version\": \"${NUMERIC}\"/" windows/info.json
          perl -pi -e "s/INFO_FILEVERSION \"\Q${VERSION}\E\"/INFO_FILEVERSION \"${NUMERIC}\"/" windows/nsis/wails_tools.nsh
      - name: Import Apple signing certificate
        if: runner.os == 'macOS'
        env:
          P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$P12_BASE64" ]; then
            echo "APPLE_CERTIFICATE_P12 is not set; the app ships unsigned."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -nE 's/.*"(Developer ID Application: [^"]+)".*/\1/p' | head -1)"
          if [ -z "$IDENTITY" ]; then echo "No Developer ID Application identity in the certificate"; exit 1; fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            xcrun notarytool store-credentials rolle-ci --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --keychain "$KEYCHAIN" > /dev/null
            echo "NOTARIZE=1" >> "$GITHUB_ENV"
          else
            echo "Notarization secrets are not set; the app is signed but not notarized."
          fi
      - name: Package
        if: matrix.task != ''
        working-directory: apps/desktop
        run: for t in ${{ matrix.task }}; do wails3 task "$t"; done
        shell: bash
        env:
          VERSION: ${{ env.VERSION }}
      - name: Build Windows for amd64 and arm64, then one installer for both
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        shell: bash
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          wails3 task windows:build ARCH=amd64 && mv bin/Rolle.exe bin/Rolle-amd64.exe
          wails3 task windows:build ARCH=arm64 && mv bin/Rolle.exe bin/Rolle-arm64.exe
          wails3 generate webview2bootstrapper -dir build/windows/nsis
          ROOT="$(cygpath -w "$PWD")"
          (cd build/windows/nsis && makensis -DARG_WAILS_AMD64_BINARY="$ROOT\bin\Rolle-amd64.exe" -DARG_WAILS_ARM64_BINARY="$ROOT\bin\Rolle-arm64.exe" project.nsi)
          mv bin/Rolle-amd64_arm64-installer.exe bin/Rolle-installer.exe
      - name: Sign and notarize the macOS app
        if: runner.os == 'macOS' && env.SIGN_IDENTITY != ''
        working-directory: apps/desktop
        run: |
          ARGS=(--input bin/Rolle.app --identity "$SIGN_IDENTITY" --hardened-runtime)
          [ -f build/darwin/entitlements.plist ] && ARGS+=(--entitlements build/darwin/entitlements.plist)
          [ -n "$NOTARIZE" ] && ARGS+=(--notarize --keychain-profile rolle-ci)
          wails3 tool sign "${ARGS[@]}"
          codesign --verify --deep --strict --verbose=2 bin/Rolle.app
      - name: Zip macOS app
        if: runner.os == 'macOS'
        working-directory: apps/desktop/bin
        run: ditto -c -k --keepParent Rolle.app Rolle-macos-universal.zip
      - name: Create the DMG from the signed app
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        run: wails3 task darwin:create:dmg
      - name: Sign, notarize, and staple the DMG
        if: runner.os == 'macOS' && env.SIGN_IDENTITY != ''
        working-directory: apps/desktop/bin
        run: |
          codesign --sign "$SIGN_IDENTITY" --timestamp Rolle.dmg
          if [ -n "$NOTARIZE" ]; then
            xcrun notarytool submit Rolle.dmg --keychain-profile rolle-ci --wait
            xcrun stapler staple Rolle.dmg
          fi
      - name: Zip the Windows executables for the updater
        if: runner.os == 'Windows'
        working-directory: apps/desktop/bin
        shell: pwsh
        # The updater replaces Rolle.exe with the single entry in the archive.
        run: |
          foreach ($arch in "amd64", "arm64") {
            New-Item -ItemType Directory -Force "stage-$arch" | Out-Null
            Copy-Item "Rolle-$arch.exe" "stage-$arch/Rolle.exe"
            Compress-Archive -Path "stage-$arch/Rolle.exe" -DestinationPath "Rolle-windows-$arch.zip" -Force
          }
      - name: Name Linux AppImage for the updater
        if: runner.os == 'Linux'
        working-directory: apps/desktop/bin
        run: for f in *.AppImage; do mv "$f" Rolle-linux-amd64.AppImage; break; done
      - name: Store the package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ runner.os }}
          if-no-files-found: error
          path: |
            apps/desktop/bin/Rolle-macos-universal.zip
            apps/desktop/bin/*.dmg
            apps/desktop/bin/Rolle-windows-*.zip
            apps/desktop/bin/Rolle-installer.exe
            apps/desktop/bin/*.AppImage
            apps/desktop/bin/*.deb

  manifest:
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Strip the v prefix from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # mise builds wails3 from source, which needs the GTK headers.
      - name: Install Wails Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev build-essential pkg-config
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false
      - name: Collect the updater payloads
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-*
          merge-multiple: true
          path: packages
      - name: Keep only the files the updater installs
        run: |
          mkdir artifacts
          cp packages/Rolle-macos-universal.zip packages/Rolle-windows-amd64.zip packages/Rolle-windows-arm64.zip packages/Rolle-linux-amd64.AppImage artifacts/
      - name: Write signing key
        run: printf '%s' "$ROLLE_UPDATER_KEY" > updater.key && chmod 600 updater.key
        env:
          ROLLE_UPDATER_KEY: ${{ secrets.ROLLE_UPDATER_KEY }}
      - name: Build and verify the signed manifest
        run: |
          channel=stable; case "$GITHUB_REF_NAME" in *-*) channel=beta;; esac
          wails3 updater manifest -version "${VERSION}" -channel "$channel" -key updater.key \
            -url-prefix "https://github.com/nateships/rolle/releases/download/${GITHUB_REF_NAME}/" \
            -output artifacts/manifest.json artifacts
          wails3 updater verify -manifest artifacts/manifest.json -publickey apps/desktop/build/updater.pub
      - name: Store the manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manifest
          if-no-files-found: error
          path: artifacts/manifest.json

  # Builds the CLI archives, then creates the GitHub release with every desktop
  # package and the manifest attached, and writes Casks/rolle-cli.rb into the tap.
  cli:
    needs: manifest
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # cosign signs checksums.txt with the workflow's OIDC identity.
      id-token: write
    env:
      # goreleaser builds the CLI with plain go; wails3 is not needed here.
      MISE_DISABLE_TOOLS: go:github.com/wailsapp/wails/v3/cmd/wails3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false
      - name: Collect the desktop packages and the manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          path: release-assets
      - run: ls -la release-assets
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  # Runs after the release is public, so the cask URL resolves as soon as the
  # tap updates. A missing tap token skips this job instead of failing the release.
  tap:
    needs: cli
    # Pre-release tags (v1.2.0-rc.1) stay off Homebrew.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Strip the v prefix from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Write the desktop cask into the tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set; the desktop cask is not updated."
            exit 0
          fi
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir artifacts --pattern Rolle.dmg
          sha="$(sha256sum artifacts/Rolle.dmg | cut -d' ' -f1)"
          git clone --depth 1 "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/nateships/homebrew-tap.git" tap
          mkdir -p tap/Casks
          cat > tap/Casks/rolle.rb <<RUBY
          cask "rolle" do
            version "$VERSION"
            sha256 "$sha"

            url "https://github.com/nateships/rolle/releases/download/v#{version}/Rolle.dmg"
            name "Rolle"
            desc "Assume any role, any cloud"
            homepage "https://getrolle.com"

            auto_updates true
            depends_on macos: ">= :monterey"

            app "Rolle.app"

            # The app stores its files in the XDG directories, which on macOS
            # resolve under ~/Library. The dot paths cover XDG_* overrides.
            zap trash: [
              "~/Library/Application Support/rolle",
              "~/Library/Caches/rolle",
              "~/.config/rolle",
              "~/.cache/rolle",
            ]
          end
          RUBY
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/rolle.rb
          git commit -m "rolle $GITHUB_REF_NAME" || exit 0
          git push
