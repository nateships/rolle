name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  # Tag v1.2.3 becomes version 1.2.3 for ldflags and the update manifest.
  VERSION: ${{ github.ref_name }}

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - name: Strip the v prefix from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  desktop:
    needs: cli
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            task: darwin:package:universal
            artifact: apps/desktop/bin/Rolle.app
          - os: windows-latest
            task: windows:package
            artifact: apps/desktop/bin/Rolle-amd64-installer.exe
          - os: ubuntu-latest
            task: linux:create:appimage linux:create:deb
            artifact: apps/desktop/bin/Rolle-*
    runs-on: ${{ matrix.os }}
    steps:
      - name: Strip the v prefix from the tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: Install Wails Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev build-essential pkg-config
      - uses: jdx/mise-action@v2
      - run: mise run setup
      - name: Import Apple signing certificate
        if: runner.os == 'macOS'
        env:
          P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$P12_BASE64" ]; then
            echo "APPLE_CERTIFICATE_P12 is not set; the app ships unsigned."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -nE 's/.*"(Developer ID Application: [^"]+)".*/\1/p' | head -1)"
          if [ -z "$IDENTITY" ]; then echo "No Developer ID Application identity in the certificate"; exit 1; fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            xcrun notarytool store-credentials rolle-ci --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --keychain "$KEYCHAIN" > /dev/null
            echo "NOTARIZE=1" >> "$GITHUB_ENV"
          else
            echo "Notarization secrets are not set; the app is signed but not notarized."
          fi
      - name: Package
        working-directory: apps/desktop
        run: for t in ${{ matrix.task }}; do wails3 task "$t"; done
        shell: bash
        env:
          VERSION: ${{ env.VERSION }}
      - name: Sign and notarize the macOS app
        if: runner.os == 'macOS' && env.SIGN_IDENTITY != ''
        working-directory: apps/desktop
        run: |
          ARGS=(--input bin/Rolle.app --identity "$SIGN_IDENTITY" --hardened-runtime)
          [ -f build/darwin/entitlements.plist ] && ARGS+=(--entitlements build/darwin/entitlements.plist)
          [ -n "$NOTARIZE" ] && ARGS+=(--notarize --keychain-profile rolle-ci)
          wails3 tool sign "${ARGS[@]}"
          codesign --verify --deep --strict --verbose=2 bin/Rolle.app
      - name: Zip macOS app
        if: runner.os == 'macOS'
        working-directory: apps/desktop/bin
        run: ditto -c -k --keepParent Rolle.app Rolle-macos-universal.zip
      - name: Create the DMG from the signed app
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        run: wails3 task darwin:create:dmg
      - name: Sign, notarize, and staple the DMG
        if: runner.os == 'macOS' && env.SIGN_IDENTITY != ''
        working-directory: apps/desktop/bin
        run: |
          codesign --sign "$SIGN_IDENTITY" --timestamp Rolle.dmg
          if [ -n "$NOTARIZE" ]; then
            xcrun notarytool submit Rolle.dmg --keychain-profile rolle-ci --wait
            xcrun stapler staple Rolle.dmg
          fi
      - name: Zip Windows executable for the updater
        if: runner.os == 'Windows'
        working-directory: apps/desktop/bin
        shell: pwsh
        run: Compress-Archive -Path Rolle.exe -DestinationPath Rolle-windows-amd64.zip -Force
      - name: Name Linux AppImage for the updater
        if: runner.os == 'Linux'
        working-directory: apps/desktop/bin
        run: for f in *.AppImage; do mv "$f" Rolle-linux-amd64.AppImage; break; done
      - name: Upload to release
        shell: bash
        run: |
          shopt -s nullglob
          files=(apps/desktop/bin/Rolle-macos-universal.zip apps/desktop/bin/*.dmg apps/desktop/bin/Rolle-windows-amd64.zip apps/desktop/bin/*.exe apps/desktop/bin/*.AppImage apps/desktop/bin/*.deb apps/desktop/bin/*.rpm)
          gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  manifest:
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - name: Strip the v prefix from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Download release artifacts
        run: gh release download "${GITHUB_REF_NAME}" --dir artifacts --pattern 'Rolle-macos-universal.zip' --pattern 'Rolle-windows-amd64.zip' --pattern 'Rolle-linux-amd64.AppImage'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Write signing key
        run: printf '%s' "$ROLLE_UPDATER_KEY" > updater.key && chmod 600 updater.key
        env:
          ROLLE_UPDATER_KEY: ${{ secrets.ROLLE_UPDATER_KEY }}
      - name: Build and verify the signed manifest
        run: |
          wails3 updater manifest -version "${VERSION}" -channel stable -key updater.key \
            -url-prefix "https://github.com/nateships/rolle/releases/download/${GITHUB_REF_NAME}/" \
            -output artifacts/manifest.json artifacts
          wails3 updater verify -manifest artifacts/manifest.json -publickey apps/desktop/build/updater.pub
      - name: Upload manifest
        run: gh release upload "${GITHUB_REF_NAME}" artifacts/manifest.json --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
