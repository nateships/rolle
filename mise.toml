[tools]
go = "1.26"
golangci-lint = "latest"
node = "26"
aube = "2.2"
"go:github.com/wailsapp/wails/v3/cmd/wails3" = "v3.0.0-beta.20"

[tasks.setup]
description = "Install frontend dependencies"
run = "aube install"
dir = "apps/desktop/frontend"

[tasks.check]
description = "Vet, lint, and test the module"
run = [
  "go vet ./...",
  "golangci-lint run ./...",
  "go test ./...",
]

[tasks.desktop]
description = "Run the desktop app in dev mode"
run = "wails3 dev"
dir = "apps/desktop"

[tasks."desktop:build"]
description = "Build the desktop app"
run = "wails3 build"
dir = "apps/desktop"
