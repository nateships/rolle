[tools]
go = "1.27.1"
golangci-lint = "2.13.2"
node = "26"
aube = "2.2"
"go:github.com/wailsapp/wails/v3/cmd/wails3" = "v3.0.0-beta.21"
prek = "0.5.2"        # git hooks, also run in CI
actionlint = "1.7.12" # workflow correctness
shellcheck = "0.11.0" # backs actionlint's run: blocks
zizmor = "1.30.1"     # workflow security audit
typos = "1.50.1"      # spell check
cosign = "3.1.3"      # keyless signature on the CLI checksum file at release
goreleaser = "2.18.1" # CLI archives and the GitHub release
"go:github.com/google/capslock/cmd/capslock" = "0.3.3" # capability analysis of the Go module graph
jq = "1.8.2"          # trims the capslock baseline

[env]
# macOS: compile cgo objects for the same minimum version the Go linker
# targets (12.0), the same floor as Info.plist, and keep the linker quiet about the repeated -lobjc that
# the Wails cgo directives add. Other platforms get the Go defaults.
CGO_CFLAGS = "{% if os() == 'macos' %}-g -O2 -mmacosx-version-min=12.0{% else %}-g -O2{% endif %}"
CGO_LDFLAGS = "{% if os() == 'macos' %}-g -O2 -mmacosx-version-min=12.0 -Wl,-no_warn_duplicate_libraries{% else %}-g -O2{% endif %}"

[tasks."setup:frontend"]
description = "Install desktop frontend dependencies"
run = "aube install"
dir = "apps/desktop/frontend"

[tasks.setup]
description = "Install frontend dependencies and git hooks"
depends = ["setup:frontend"]
run = "prek install"

[tasks."check:frontend"]
description = "Typecheck, lint, format-check, and test the desktop frontend"
run = ["aube run typecheck", "aube run lint", "aube run format:check", "aube run test"]
dir = "apps/desktop/frontend"

[tasks.coverage]
description = "Test coverage for Go and the desktop frontend"
run = [
  "go test ./... -coverprofile=coverage.out > /dev/null && go tool cover -func=coverage.out | tail -1 && rm -f coverage.out",
  "cd apps/desktop/frontend && aube run test:coverage",
]

[tasks.hooks]
description = "Run every git hook on the whole tree"
run = "prek run --all-files"

[tasks.check]
description = "Vet, lint, and test the module"
run = [
  "go vet ./...",
  "golangci-lint run ./...",
  "go test ./...",
]

[tasks.desktop]
description = "Run the desktop app in dev mode"
run = "wails3 dev"
dir = "apps/desktop"

[tasks."desktop:demo"]
description = "Run the desktop app on fictional data (no real workspace, keychain, or AWS config)"
run = "wails3 dev"
dir = "apps/desktop"
env = { ROLLE_DEMO = "1" }

[tasks."desktop:build"]
description = "Build the desktop app"
run = "wails3 build"
dir = "apps/desktop"

[tasks.docs]
description = "Run the docs site locally"
run = ["aube install", "aube run dev"]
dir = "docs"

[tasks."docs:build"]
description = "Build the docs site"
run = ["aube ci", "aube run build"]
dir = "docs"

[tasks.cli]
description = "Run the CLI from source against your real workspace: mise run cli -- integration list"
run = "go run ./cmd/rolle"

# The capability set depends on the target OS (the Linux keyring speaks
# D-Bus), so both tasks analyze the Linux build wherever they run.
[tasks.capabilities]
description = "Rewrite capslock.json: the capabilities (network, exec, files) each Go package reaches, transitive dependencies included"
run = "capslock -packages ./cmd/...,./internal/... -granularity=package -output=json | jq -S 'del(.capabilityInfo[].path, .capabilityInfo[].depPath)' > capslock.json"
env = { GOOS = "linux" }

[tasks."capabilities:check"]
description = "Fail when a Go package gained or lost a capability since capslock.json"
run = "capslock -packages ./cmd/...,./internal/... -granularity=package -output=compare capslock.json"
env = { GOOS = "linux" }

[tasks.reset]
description = "Wipe the local rolle workspace, secrets, cache, and AWS profiles (back to onboarding)"
run = "go run ./cmd/rolle reset --yes"
