[tools]
rust = { version = "1.95", components = ["rustfmt", "clippy"] }
node = "26"
aube = "2.2"
mr-boxington = { version = "latest", postinstall = "mbx setup --yes" }

[tasks.setup]
description = "Install frontend dependencies"
run = "aube install"
dir = "apps/desktop"

[tasks.check]
description = "Format check, lint, and test the workspace"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo test --workspace",
]

[tasks.desktop]
description = "Run the desktop app in dev mode"
run = "aubr tauri dev"
dir = "apps/desktop"
