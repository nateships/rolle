[tools]
go = "1.27.1"
golangci-lint = "2.13.2"
node = "26"
aube = "2.2"
"go:github.com/wailsapp/wails/v3/cmd/wails3" = "v3.0.0-beta.20"
prek = "0.5.2"        # git hooks, also run in CI
actionlint = "1.7.12" # workflow correctness
shellcheck = "0.11.0" # backs actionlint's run: blocks
zizmor = "1.30.1"     # workflow security audit
typos = "1.50.1"      # spell check
cosign = "3.1.3"      # keyless signature on the CLI checksum file at release
goreleaser = "2.18.1" # CLI archives and the GitHub release

[tasks."setup:frontend"]
description = "Install desktop frontend dependencies"
run = "aube install"
dir = "apps/desktop/frontend"

[tasks.setup]
description = "Install frontend dependencies and git hooks"
depends = ["setup:frontend"]
run = "prek install"

[tasks."check:frontend"]
description = "Typecheck, lint, format-check, and test the desktop frontend"
run = ["aube run typecheck", "aube run lint", "aube run format:check", "aube run test"]
dir = "apps/desktop/frontend"

[tasks.coverage]
description = "Test coverage for Go and the desktop frontend"
run = [
  "go test ./... -coverprofile=coverage.out > /dev/null && go tool cover -func=coverage.out | tail -1 && rm -f coverage.out",
  "cd apps/desktop/frontend && aube run test:coverage",
]

[tasks.hooks]
description = "Run every git hook on the whole tree"
run = "prek run --all-files"

[tasks.check]
description = "Vet, lint, and test the module"
run = [
  "go vet ./...",
  "golangci-lint run ./...",
  "go test ./...",
]

[tasks.desktop]
description = "Run the desktop app in dev mode"
run = "wails3 dev"
dir = "apps/desktop"

[tasks."desktop:demo"]
description = "Run the desktop app on fictional data (no real workspace, keychain, or AWS config)"
run = "wails3 dev"
dir = "apps/desktop"
env = { ROLLE_DEMO = "1" }

[tasks."desktop:build"]
description = "Build the desktop app"
run = "wails3 build"
dir = "apps/desktop"

[tasks.docs]
description = "Run the docs site locally"
run = ["aube install", "aube run dev"]
dir = "docs"

[tasks."docs:build"]
description = "Build the docs site"
run = ["aube ci", "aube run build"]
dir = "docs"

[tasks.reset]
description = "Wipe the local rolle workspace, secrets, cache, and AWS profiles (back to onboarding)"
run = "go run ./cmd/rolle reset --yes"
