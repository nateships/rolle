version: 2
project_name: rolle

builds:
  - id: rolle
    main: ./cmd/rolle
    binary: rolle
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/nateships/rolle/internal/version.Version={{.Version}}

archives:
  - id: rolle
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude: ["^chore", "^ci", "^docs", "^test"]

release:
  # The desktop jobs create a draft and upload their packages first.
  # goreleaser then fills in the notes and publishes.
  draft: false
  mode: replace
  prerelease: auto

homebrew_casks:
  - name: rolle-cli
    ids: [rolle]
    binaries: [rolle]
    homepage: https://getrolle.com
    license: GPL-3.0-or-later
    description: Assume any role, any cloud
    directory: Casks
    skip_upload: auto
    generate_completions_from_executable:
      executable: rolle
      args: [completion]
      shells: [bash, zsh, fish]
    commit_msg_template: "rolle-cli {{ .Tag }}"
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    repository:
      owner: nateships
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
