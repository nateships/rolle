version: 2
project_name: rolle

# goreleaser builds nothing here. The desktop packages carry the rolle
# command, and the release workflow builds them on their own runners. This
# file exists for the checksum file, its signature, and the release itself.
builds:
  - skip: true

checksum:
  name_template: checksums.txt
  # The desktop packages and the update manifest are the release assets, so
  # one signature and one provenance attestation over checksums.txt cover
  # every one of them.
  extra_files:
    - glob: release-assets/*

# Keyless Sigstore signature over the checksum file. The GitHub Actions OIDC
# identity of the release workflow is the signer; there is no key to manage.
# Verify with the command in docs/content/install.mdx.
signs:
  - cmd: cosign
    artifacts: checksum
    output: true
    # cosign 3 writes one Sigstore bundle with the signature and certificate.
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - ${artifact}
      - --yes

release:
  # goreleaser fills the draft that release-please made. The workflow downloads
  # the signed desktop packages and the update manifest into release-assets/
  # first, so one step publishes everything. goreleaser finds a draft by its
  # name, which release-please sets to the tag; a lookup by tag skips drafts.
  draft: false
  use_existing_draft: true
  mode: replace
  prerelease: auto
  extra_files:
    - glob: release-assets/*
