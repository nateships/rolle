version: 2
project_name: rolle

builds:
  - id: rolle
    main: ./cmd/rolle
    binary: rolle
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/nateships/rolle/internal/version.Version={{.Version}}

archives:
  - id: rolle
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

# Keyless Sigstore signature over the checksum file. The GitHub Actions OIDC
# identity of the release workflow is the signer; there is no key to manage.
# Verify with the command in docs/content/install.mdx.
signs:
  - cmd: cosign
    artifacts: checksum
    output: true
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - --output-certificate=${certificate}
      - --output-signature=${signature}
      - ${artifact}
      - --yes

changelog:
  use: github
  sort: asc
  filters:
    exclude: ["^chore", "^ci", "^docs", "^test"]

release:
  # goreleaser creates the release. The workflow downloads the signed desktop
  # packages and the update manifest into release-assets/ first, so one step
  # publishes everything.
  draft: false
  mode: replace
  prerelease: auto
  extra_files:
    - glob: release-assets/*

homebrew_casks:
  - name: rolle-cli
    ids: [rolle]
    binaries: [rolle]
    homepage: https://getrolle.com
    license: GPL-3.0-or-later
    description: Assume any role, any cloud
    directory: Casks
    skip_upload: auto
    generate_completions_from_executable:
      executable: rolle
      args: [completion]
      shells: [bash, zsh, fish]
    commit_msg_template: "rolle-cli {{ .Tag }}"
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    repository:
      owner: nateships
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
