version: 2
project_name: rolle

builds:
  - id: rolle
    main: ./cmd/rolle
    binary: rolle
    env: [CGO_ENABLED=0]
    # -trimpath keeps the builder's paths out of the binary and -buildvcs=false
    # keeps the checkout state out, so a build of the same tag with the same
    # toolchain is byte for byte identical, and the same as the command the
    # desktop app carries. The docs security page gives the recipe.
    flags: [-trimpath, -buildvcs=false]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/nateships/rolle/internal/version.Version={{.Version}}

archives:
  - id: rolle
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # rolle-cli_ marks these as the command alone; the app payloads the
    # updater installs are the rolle-update-* zips.
    name_template: "{{ .ProjectName }}-cli_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  # The desktop packages and the update manifest join the CLI archives in
  # the checksum file, so one signature and one provenance attestation over
  # checksums.txt cover every release asset.
  extra_files:
    - glob: release-assets/*

# Keyless Sigstore signature over the checksum file. The GitHub Actions OIDC
# identity of the release workflow is the signer; there is no key to manage.
# Verify with the command in docs/content/install.mdx.
signs:
  - cmd: cosign
    artifacts: checksum
    output: true
    # cosign 3 writes one Sigstore bundle with the signature and certificate.
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - ${artifact}
      - --yes

release:
  # goreleaser creates the release. The workflow downloads the signed desktop
  # packages and the update manifest into release-assets/ first, so one step
  # publishes everything.
  draft: false
  mode: replace
  prerelease: auto
  extra_files:
    - glob: release-assets/*
