version: 2
project_name: rolle

builds:
  - id: rolle
    main: ./cmd/rolle
    binary: rolle
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/nateships/rolle/internal/version.Version={{.Version}}

archives:
  - id: rolle
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude: ["^chore", "^ci", "^docs", "^test"]

release:
  draft: true
  prerelease: auto
