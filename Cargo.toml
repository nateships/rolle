[workspace]
resolver = "2"
members = [
  "crates/rolle-core",
  "crates/rolled",
  "crates/rolle",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/nateships/rolle"

[workspace.dependencies]
rolle-core = { path = "crates/rolle-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

# Tauri size guidance: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
